[project]
name = "vmd-mcp"
version = "0.1.0"
description = "MCP Server to control and visualize structures in VMD (Visual Molecular Dynamics)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
